# Radar Search Targets & Platform Catalog
# Default Role: Junior Developer (AI / Full-Stack / ASE)
# Default Location: Worldwide Remote + Onsite in Lahore, Islamabad, Faisalabad

default_role: "Junior Developer (AI / Full-Stack / ASE)"
default_location: "worldwide_remote_or_pakistan_onsite"
default_experience: "junior"

# 30 Curated Roles heavily focused on AI/ML and Full-Stack
roles:
  ai_machine_learning:
    - id: "junior_dev_ai_fullstack_ase"
      name: "Junior Developer (AI / Full-Stack / ASE)"
      keywords: ["junior developer", "associate software engineer", "ai engineer", "full stack", "python", "pytorch", "react"]
    - id: "junior_ml_engineer"
      name: "Junior Machine Learning Engineer"
      keywords: ["machine learning", "deep learning", "pytorch", "tensorflow", "scikit-learn", "python"]
    - id: "associate_ai_engineer"
      name: "Associate AI Engineer"
      keywords: ["ai engineer", "llm", "generative ai", "langchain", "prompt engineering", "openai"]
    - id: "junior_deep_learning_engineer"
      name: "Junior Deep Learning Engineer"
      keywords: ["deep learning", "neural networks", "cnn", "rnn", "transformers", "pytorch"]
    - id: "junior_computer_vision_engineer"
      name: "Junior Computer Vision Engineer"
      keywords: ["computer vision", "opencv", "yolo", "image processing", "object detection"]
    - id: "junior_nlp_llm_engineer"
      name: "Junior NLP / LLM Engineer"
      keywords: ["nlp", "natural language processing", "llm", "huggingface", "vector db", "rag"]
    - id: "genai_agentic_workflow_developer"
      name: "Generative AI & Agentic Workflow Developer"
      keywords: ["agentic", "ai agents", "langgraph", "crewai", "autogen", "generative ai"]
    - id: "junior_mlops_engineer"
      name: "Junior MLOps Engineer"
      keywords: ["mlops", "model deployment", "docker", "kubeflow", "mlflow", "fastapi"]
    - id: "associate_data_scientist"
      name: "Associate Data Scientist"
      keywords: ["data scientist", "pandas", "numpy", "statistics", "predictive modeling", "eda"]
    - id: "junior_ai_research_engineer"
      name: "Junior AI Research Engineer"
      keywords: ["ai research", "algorithm development", "machine learning research", "papers"]
    - id: "junior_pytorch_python_developer"
      name: "Junior PyTorch / Python AI Developer"
      keywords: ["pytorch", "python", "model training", "cuda", "tensors"]
    - id: "ai_prompt_systems_engineer"
      name: "AI Prompt & Systems Engineer"
      keywords: ["prompt engineer", "evals", "system prompts", "few shot", "ai workflows"]
    - id: "junior_data_ml_pipeline_engineer"
      name: "Junior Data / ML Pipeline Engineer"
      keywords: ["data pipeline", "etl", "feature engineering", "airflow", "sql"]
    - id: "applied_ai_developer_entry"
      name: "Applied AI Developer (Entry-Level)"
      keywords: ["applied ai", "ai integration", "api integration", "openai api", "anthropic"]
    - id: "junior_ai_automation_engineer"
      name: "Junior AI Automation Engineer"
      keywords: ["ai automation", "workflow automation", "rpa", "zapier", "make", "python"]

  fullstack_web:
    - id: "junior_fullstack_developer"
      name: "Junior Full-Stack Developer"
      keywords: ["full stack", "frontend", "backend", "javascript", "python", "database"]
    - id: "fullstack_python_react_developer"
      name: "Full-Stack Python / React Developer"
      keywords: ["react", "python", "fastapi", "django", "postgresql", "rest api"]
    - id: "fullstack_typescript_nextjs_developer"
      name: "Full-Stack TypeScript / Next.js Developer"
      keywords: ["next.js", "react", "typescript", "tailwind", "node.js", "prisma"]
    - id: "junior_mern_pern_stack_developer"
      name: "Junior MERN / PERN Stack Developer"
      keywords: ["mongodb", "express", "react", "node.js", "postgresql"]
    - id: "associate_frontend_developer"
      name: "Associate Frontend Developer (React / Next.js)"
      keywords: ["frontend developer", "react", "next.js", "ui/ux", "css", "html"]
    - id: "junior_backend_developer_python"
      name: "Junior Backend Developer (Python / FastAPI / Django)"
      keywords: ["python backend", "fastapi", "django", "sql", "orm", "rest api"]
    - id: "junior_backend_developer_nodejs"
      name: "Junior Backend Developer (Node.js / Express)"
      keywords: ["node.js", "express", "javascript", "backend", "apis"]
    - id: "junior_backend_developer_golang"
      name: "Junior Backend Developer (Go / Golang)"
      keywords: ["golang", "go developer", "concurrency", "microservices", "backend"]
    - id: "junior_web_application_developer"
      name: "Junior Web Application Developer"
      keywords: ["web application", "software developer", "full stack", "html5", "css3"]
    - id: "junior_rest_graphql_api_developer"
      name: "Junior REST / GraphQL API Developer"
      keywords: ["rest api", "graphql", "api development", "postman", "swagger"]

  core_software_cloud:
    - id: "associate_software_engineer_ase"
      name: "Associate Software Engineer (ASE 0-2 YOE)"
      keywords: ["associate software engineer", "ase", "entry level software engineer", "git", "oop"]
    - id: "junior_cloud_devops_engineer"
      name: "Junior Cloud & DevOps Engineer"
      keywords: ["devops", "cloud", "aws", "docker", "ci/cd", "linux"]
    - id: "junior_data_engineer"
      name: "Junior Data Engineer (SQL / Python / ETL)"
      keywords: ["data engineer", "sql", "etl", "data warehouse", "postgresql"]
    - id: "junior_qa_automation_engineer"
      name: "Junior QA / Automation Test Engineer"
      keywords: ["qa engineer", "automation testing", "selenium", "pytest", "cypress"]
    - id: "junior_system_software_developer"
      name: "Junior System Software Developer"
      keywords: ["system software", "c++", "python", "linux", "networking"]

